version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.16

    working_directory: ~/nuclearmod

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Build NuclearMod
          command: npm run build

      - run:
          name: Run tests
          command: npm test
          when: on_success

      - store_artifacts:
          path: build
          destination: nuclearmod-build

workflows:
  nuclearmod:
    jobs:
      - build